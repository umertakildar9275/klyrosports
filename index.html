/* ============================================================
   useInView — IntersectionObserver hook (drives scroll reveals)
   ============================================================ */
function useInView(options = {}) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const el = ref.current;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setInView(true);
        if (options.once !== false) obs.unobserve(el);
      } else if (options.once === false) {
        setInView(false);
      }
    }, { threshold: options.threshold ?? 0.15, rootMargin: options.rootMargin ?? "0px 0px -50px 0px" });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

/* ============================================================
   FadeIn — scroll-triggered entrance wrapper
   ============================================================ */
function FadeIn({ children, delay = 0, duration = 0.7, y = 24, x = 0, once = true, className = "" }) {
  const [ref, inView] = useInView({ once });
  const style = {
    transitionProperty: "opacity, transform",
    transitionDuration: REDUCED_MOTION ? "0.01ms" : `${duration}s`,
    transitionTimingFunction: "cubic-bezier(0.25, 0.1, 0.25, 1)",
    transitionDelay: REDUCED_MOTION ? "0ms" : `${delay}s`,
    opacity: inView ? 1 : 0,
    transform: inView ? "translate3d(0,0,0)" : `translate3d(${x}px, ${y}px, 0)`,
    willChange: "opacity, transform",
  };
  return <div ref={ref} style={style} className={className}>{children}</div>;
}

/* ============================================================
   Magnet — mouse-following magnetic hover wrapper
   ============================================================ */
function Magnet({ children, padding = 100, strength = 3, className = "" }) {
  const ref = useRef(null);
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const [active, setActive] = useState(false);

  useEffect(() => {
    if (REDUCED_MOTION) return;
    const el = ref.current;
    if (!el) return;

    function onMove(e) {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const distX = e.clientX - cx;
      const distY = e.clientY - cy;
      const dist = Math.sqrt(distX * distX + distY * distY);
      const zone = Math.max(rect.width, rect.height) / 2 + padding;
      if (dist < zone) {
        setActive(true);
        setPos({ x: distX / strength, y: distY / strength });
      } else if (active) {
        setActive(false);
        setPos({ x: 0, y: 0 });
      }
    }
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, [active, padding, strength]);

  return (
    <div
      ref={ref}
      className={className}
      style={{
        transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`,
        transition: active ? "transform 120ms ease-out" : "transform 500ms cubic-bezier(0.25,1,0.5,1)",
        willChange: "transform",
        display: "inline-block",
      }}
    >
      {children}
    </div>
  );
}

/* ============================================================
   AnimatedText — character-by-character scroll reveal
   ============================================================ */
function AnimatedText({ text, className = "" }) {
  const ref = useRef(null);
  const [progress, setProgress] = useState(0);
  const chars = useMemo(() => text.split(""), [text]);

  useEffect(() => {
    if (REDUCED_MOTION) { setProgress(1); return; }
    function onScroll() {
      const el = ref.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const vh = window.innerHeight;
      const start = vh * 0.85;
      const end = vh * 0.35;
      const p = (start - rect.top) / (start - end);
      setProgress(Math.min(1, Math.max(0, p)));
    }
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <p ref={ref} className={className}>
      {chars.map((ch, i) => {
        const charProgress = Math.min(1, Math.max(0, progress * chars.length - i * 0.6));
        const opacity = 0.2 + 0.8 * charProgress;
        return (
          <span key={i} style={{ opacity, transition: "opacity 60ms linear" }}>
            {ch}
          </span>
        );
      })}
    </p>
  );
}

/* ============================================================
   Scroll3DBackground — code-only looping 3D scene (canvas)
   Layered "shards" projected with a simple perspective transform,
   drifting on a loop and reacting subtly to mouse + scroll.
   ============================================================ */
function Scroll3DBackground() {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const mouse = useRef({ x: 0, y: 0 });
  const scrollY = useRef(0);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    let W, H, DPR;
    const isMobile = window.innerWidth < 768;
    const COUNT = REDUCED_MOTION ? 0 : isMobile ? 26 : 60;

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    const nodes = Array.from({ length: COUNT }, () => ({
      x: (Math.random() - 0.5) * 2,
      y: (Math.random() - 0.5) * 2,
      z: Math.random() * 1 + 0.15,
      vz: (Math.random() * 0.0006 + 0.00025) * (Math.random() < 0.5 ? 1 : -1),
      r: Math.random() * 1.6 + 0.6,
      hueRed: Math.random() > 0.72,
    }));

    function onMouseMove(e) {
      mouse.current.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.current.y = (e.clientY / window.innerHeight) * 2 - 1;
    }
    function onScroll() { scrollY.current = window.scrollY; }
    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("scroll", onScroll, { passive: true });

    function project(n, t) {
      // gentle continuous drift, wraps in depth for an infinite loop
      let z = n.z + Math.sin(t * n.vz * 1000 + n.x * 10) * 0.15;
      z = ((z % 1) + 1) % 1;
      const parallaxX = mouse.current.x * 0.06 * (1 - z);
      const parallaxY = mouse.current.y * 0.04 * (1 - z);
      const scrollDrift = (scrollY.current * 0.00012) * (1 - z);
      const scale = 0.35 / (0.35 + z);
      const px = (n.x + parallaxX) * scale * W * 0.55 + W / 2;
      const py = (n.y + parallaxY + scrollDrift) * scale * H * 0.55 + H / 2;
      return { px, py, scale, z };
    }

    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      // ambient radial glow
      const g = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, Math.max(W, H) * 0.6);
      g.addColorStop(0, "rgba(255,107,107,0.05)");
      g.addColorStop(1, "rgba(12,12,12,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      nodes.forEach((n) => {
        const { px, py, scale, z } = project(n, t / 1000);
        const alpha = (1 - z) * 0.8;
        ctx.beginPath();
        ctx.arc(px, py, n.r * scale * 6, 0, Math.PI * 2);
        ctx.fillStyle = n.hueRed
          ? `rgba(255,107,107,${alpha * 0.8})`
          : `rgba(215,226,234,${alpha * 0.35})`;
        ctx.fill();
      });

      // faint connecting lines between near nodes for a "mesh" feel
      ctx.lineWidth = 0.5;
      for (let i = 0; i < nodes.length; i++) {
        const a = project(nodes[i], t / 1000);
        if (a.z > 0.6) continue;
        for (let j = i + 1; j < nodes.length; j++) {
          const b = project(nodes[j], t / 1000);
          if (b.z > 0.6) continue;
          const dx = a.px - b.px, dy = a.py - b.py;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < 110) {
            ctx.strokeStyle = `rgba(255,107,107,${0.08 * (1 - d / 110)})`;
            ctx.beginPath();
            ctx.moveTo(a.px, a.py);
            ctx.lineTo(b.px, b.py);
            ctx.stroke();
          }
        }
      }

      if (!REDUCED_MOTION) rafRef.current = requestAnimationFrame(draw);
    }

    if (COUNT > 0) rafRef.current = requestAnimationFrame(draw);
    else {
      // static faint gradient only, for reduced-motion / low-power
      ctx.clearRect(0, 0, W, H);
      const g = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, Math.max(W, H) * 0.6);
      g.addColorStop(0, "rgba(255,107,107,0.06)");
      g.addColorStop(1, "rgba(12,12,12,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    return () => {
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener("resize", resize);
      window.removeEventListener("mousemove", onMouseMove);
      window.removeEventListener("scroll", onScroll);
    };
  }, []);

  return (
    <canvas
      ref={canvasRef}
      className="pointer-events-none absolute inset-0 h-full w-full"
      aria-hidden="true"
    />
  );
}

function Navbar() {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);
  const links = ["About", "Skills", "Projects", "Contact"];

  useEffect(() => {
    function onScroll() { setScrolled(window.scrollY > 24); }
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  function go(id) {
    setOpen(false);
    document.getElementById(id.toLowerCase())?.scrollIntoView({ behavior: "smooth" });
  }

  return (
    <nav
      className={
        "fixed top-0 left-0 right-0 z-50 transition-all duration-300 " +

          LEO<span className="text-accent">.</span>
        </a>
        <div className="hidden md:flex items-center gap-10">
          {links.map((l) => (
            <a key={l} href={`#${l.toLowerCase()}`}
               onClick={(e) => { e.preventDefault(); go(l); }}
               className="text-[11px] font-medium uppercase tracking-[0.22em] text-white/80 transition-opacity duration-200 hover:opacity-70 hover:text-accent">
              {l}
            </a>
          ))}
        </div>
        <button
          className="md:hidden text-white"
          onClick={() => setOpen((v) => !v)}
          aria-label={open ? "Close menu" : "Open menu"}
        >
          {open ? <XIcon /> : <MenuIcon />}
        </button>
      </div>
      {open && (
        <div className="md:hidden flex flex-col gap-1 border-t border-white/10 bg-black/70 backdrop-blur-xl px-6 py-4">
          {links.map((l) => (
            <a key={l} href={`#${l.toLowerCase()}`}

               className="py-3 text-sm font-medium uppercase tracking-[0.2em] text-white/85 border-b border-white/5 last:border-0">
              {l}
            </a>
          ))}
        </div>
      )}

  );
}

const SKILLS = [

  { name: "Full-Stack Development", desc: "End-to-end systems — frontend, backend, and everything between.", Icon: LayersIcon },

  { name: "Responsive Design", desc: "One codebase, every screen, no compromises.", Icon: PhoneRectIcon },
  { name: "UI/UX Implementation", desc: "Design intent translated faithfully into working product.", Icon: PaletteIcon },
];

function SkillCard({ skill, index }) {
  const cardRef = useRef(null);
  const [tilt, setTilt] = useState({ x: 0, y: 0 });

  function onMove(e) {
    if (REDUCED_MOTION) return;
    const rect = cardRef.current.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width - 0.5;
    const py = (e.clientY - rect.top) / rect.height - 0.5;
    setTilt({ x: py * -8, y: px * 8 });
  }
  function onLeave() { setTilt({ x: 0, y: 0 }); }

  return (
    <FadeIn delay={index * 0.1}>
      <div
        ref={cardRef}
        onMouseMove={onMove}
        onMouseLeave={onLeave}
        className="glass group relative h-full rounded-3xl p-7 transition-shadow duration-300 hover:glow-red"
        style={{
          transform: `perspective(600px) rotateX(${tilt.x}deg) rotateY(${tilt.y}deg)`,
          transition: "transform 200ms ease-out, box-shadow 300ms ease",
        }}
      >
        <div className="mb-5 inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-accent/10 text-accent">
          <skill.Icon size={22} />
        </div>
        <h3 className="font-display text-lg font-semibold text-white md:text-xl">{skill.name}</h3>
        <p className="mt-2 text-sm leading-relaxed text-dim">{skill.desc}</p>
      </div>
    </FadeIn>
  );
}

  },

    url: "https://jersifynation.online",
    desc: "A jersey and sportswear e-commerce platform designed to scale product catalog and traffic without sacrificing speed.",
  },
];

function ProjectCard({ project, index, total }) {
  const ref = useRef(null);
  const [scale, setScale] = useState(1);
  const top = 96 + index * 28; // px, matches sticky top offset

  useEffect(() => {
    if (REDUCED_MOTION) return;
    function onScroll() {
      const el = ref.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const targetScale = 1 - (total - 1 - index) * 0.03;
      // Progress: how far the card has scrolled past its sticky point
      const progress = Math.min(1, Math.max(0, (top - rect.top) / (window.innerHeight * 0.6)));
      const s = 1 - progress * (1 - targetScale);
      setScale(Math.max(targetScale, s));
    }
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, [index, total, top]);

  return (
    <div
      ref={ref}
      className="sticky mb-8"
      style={{ top: `${top}px` }}
    >
      <div
        className="glass relative flex h-[78vh] min-h-[460px] flex-col justify-between overflow-hidden rounded-[40px] border-2 border-accent/25 bg-panel/80 p-7 md:h-[82vh] md:rounded-[56px] md:p-12"
        style={{ transform: `scale(${scale})`, transformOrigin: "top center", transition: REDUCED_MOTION ? "none" : "transform 60ms linear" }}
      >
        <div className="flex flex-wrap items-start justify-between gap-6">
          <div>
            <span className="font-display text-sm font-semibold text-accent">0{index + 1}</span>
            <h3 className="hero-heading font-display mt-2 text-4xl font-extrabold tracking-tight md:text-6xl">
              {project.name}
            </h3>
            <p className="mt-4 max-w-md text-sm leading-relaxed text-dim md:text-base">
              {project.desc}
            </p>
          </div>
          <LiveProjectButton href={project.url} />
        </div>

        <div className="mt-8 flex-1 overflow-hidden rounded-3xl border border-white/10 bg-gradient-to-br from-white/[0.04] to-accent/[0.05]">
          <div className="flex h-full w-full items-center justify-center">
            <span className="font-display text-xs uppercase tracking-[0.3em] text-white/30">
              Project preview — add screenshot
            </span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   Contact
   ============================================================ */
function ContactSection() {
  const [form, setForm] = useState({ name: "", phone: "", email: "", subject: "", description: "" });
  const [status, setStatus] = useState("idle"); // idle | sending | success | error

  function update(field) {
    return (e) => setForm((f) => ({ ...f, [field]: e.target.value }));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setStatus("sending");
    try {
      const res = await fetch(FORMSPREE_ENDPOINT_HERE, {
        method: "POST",
        headers: { Accept: "application/json", "Content-Type": "application/json" },
        body: JSON.stringify(form),
      });
      if (res.ok) {
        setStatus("success");
        setForm({ name: "", phone: "", email: "", subject: "", description: "" });
      } else {
        setStatus("error");
      }
    } catch (err) {
      setStatus("error");
    }
  }

  const inputClass =
    "w-full rounded-xl border border-white/10 bg-white/[0.03] px-4 py-3 text-sm text-white placeholder-white/30 transition-colors focus:border-accent";

  return (
    <section id="contact" className="relative px-6 py-28 md:px-10">
      <div className="mx-auto max-w-6xl">
        <FadeIn className="text-center">
          <h2 className="hero-heading font-display text-4xl font-extrabold uppercase tracking-tight md:text-6xl">
            Let's Work Together
          </h2>
          <p className="mx-auto mt-5 max-w-xl text-base text-dim md:text-lg">
            Have a project in mind or need a modern website for your business? Let's build something great together.
          </p>
        </FadeIn>

        <div className="mt-16 grid grid-cols-1 gap-10 md:grid-cols-5">
          <FadeIn delay={0.1} className="md:col-span-2">
            <div className="glass flex h-full flex-col justify-between rounded-3xl p-8">
              <div className="space-y-5">
                <a href={`https://instagram.com/${INSTAGRAM_HANDLE}`} target="_blank" rel="noopener noreferrer"
                   className="flex items-center gap-4 rounded-2xl border border-white/10 p-4 transition-colors hover:border-accent/50 hover:bg-accent/5">
                  <InstagramIcon className="text-accent" />
                  <div>
                    <p className="text-xs uppercase tracking-widest text-dim">Instagram</p>
                    <p className="text-sm font-medium text-white">@{INSTAGRAM_HANDLE}</p>
                  </div>
                </a>
                <a href={`https://wa.me/91${WHATSAPP_NUMBER}`} target="_blank" rel="noopener noreferrer"
                   className="flex items-center gap-4 rounded-2xl border border-white/10 p-4 transition-colors hover:border-accent/50 hover:bg-accent/5">
                  <WhatsAppIcon className="text-accent" />
                  <div>
                    <p className="text-xs uppercase tracking-widest text-dim">WhatsApp</p>
                    <p className="text-sm font-medium text-white">{WHATSAPP_NUMBER}</p>
                  </div>
                </a>
                <a href={`tel:+91${WHATSAPP_NUMBER}`}
                   className="flex items-center gap-4 rounded-2xl border border-white/10 p-4 transition-colors hover:border-accent/50 hover:bg-accent/5">
                  <PhoneRectIcon className="text-accent" />
                  <div>
                    <p className="text-xs uppercase tracking-widest text-dim">Call</p>
                    <p className="text-sm font-medium text-white">{WHATSAPP_NUMBER}</p>
                  </div>
                </a>
              </div>

              <a
                href={RESUME_URL}
                target="_blank"
                rel="noopener noreferrer"
                className="mt-6 inline-flex items-center justify-center gap-2 rounded-full border border-white/20 px-6 py-3 text-[11px] font-semibold uppercase tracking-[0.2em] text-white transition-colors hover:bg-white hover:text-black"
              >
                View Resume <ArrowUpRightIcon size={13} />
              </a>
            </div>
          </FadeIn>

          <FadeIn delay={0.2} className="md:col-span-3">
            <form onSubmit={handleSubmit} className="glass space-y-4 rounded-3xl p-8">
              <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <input required type="text" placeholder="Name" value={form.name} onChange={update("name")} className={inputClass} />
                <input required type="tel" placeholder="Phone" value={form.phone} onChange={update("phone")} className={inputClass} />
              </div>
              <input required type="email" placeholder="Email" value={form.email} onChange={update("email")} className={inputClass} />
              <input required type="text" placeholder="Subject" value={form.subject} onChange={update("subject")} className={inputClass} />
              <textarea required rows="4" placeholder="Description" value={form.description} onChange={update("description")} className={inputClass} />

              <button
                type="submit"
                disabled={status === "sending"}
                className="w-full rounded-xl px-6 py-3.5 text-xs font-semibold uppercase tracking-[0.2em] text-white transition-transform hover:scale-[1.01] active:scale-[0.99] disabled:opacity-60"
                style={{ background: "linear-gradient(135deg, #FF6B6B 0%, #C93E3E 100%)" }}
              >
                {status === "sending" ? "Sending..." : "Send Message"}
              </button>

              {status === "success" && (
                <p className="text-center text-sm font-medium text-emerald-400">Message sent successfully.</p>
              )}
              {status === "error" && (
                <p className="text-center text-sm font-medium text-accent">Something went wrong. Please try again.</p>
              )}
            </form>
          </FadeIn>
        </div>
      </div>
    </section>
  );
}
